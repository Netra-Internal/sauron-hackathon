# Applied on flywheel-01 (2026-10-24 23:05 UTC) in /etc/nginx/sites-available/internal. At the top of the file (http context):
#   proxy_cache_path /var/cache/nginx/hackauth keys_zone=hackauth:1m max_size=10m inactive=60s;
# Inside the server block, before '# <<< /hack/':
    # sauron-hackathon cloud: live LL-HLS from the RunPod edge (mediamtx) through netra-cloud-hls-tunnel, behind the
    # same internal login as /hack/ (auth_request to hackdash: 200 signed in, 401 not)
    location /hack/stream/ {
        auth_request /_hack_stream_auth;
        error_page 401 = @hack_stream_401;
        proxy_pass http://127.0.0.1:8460/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30;
        add_header Cache-Control no-cache always;
    }
    location = /_hack_stream_auth {
        internal;
        proxy_pass http://127.0.0.1:8500/hack/api/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_cache hackauth;
        proxy_cache_key "$http_cookie|$http_authorization";
        proxy_cache_valid 200 30s;
        proxy_cache_valid any 0;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    }
    location @hack_stream_401 {
        return 401 "sign in at /map/login\n";
    }
