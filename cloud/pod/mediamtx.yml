# Cloud edge ingest. Cameras push H.264 over RTSPS (:8322, the only port exposed besides SSH) as user "pusher";
# the edge processes on the pod read plain RTSP on loopback (:8554, not exposed). Only TCP: RunPod maps TCP ports only.
logLevel: info
api: yes
apiAddress: 127.0.0.1:9997
metrics: no
rtmp: no
# LL-HLS for browsers, loopback only: the droplet reaches it through its SSH tunnel and serves it at /hack/stream/<cam>/
# behind the internal login. Always remuxing so the first picture is ready when a page opens.
hls: yes
hlsAddress: 127.0.0.1:8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: yes
hlsAllowOrigin: '*'
webrtc: no
srt: no
rtsp: yes
protocols: [tcp]
encryption: optional
rtspAddress: :8554
rtspsAddress: :8322
serverKey: @W@/tls.key
serverCert: @W@/tls.crt
readTimeout: 15s
writeTimeout: 15s
authInternalUsers:
  - user: any
    pass:
    ips: ['127.0.0.1/32', '::1/128']
    permissions:
      - action: read
      - action: api
  - user: pusher
    pass: @PUSH_PASS@
    ips: []
    permissions:
      - action: publish
  # one guest box (demo-node): may publish only its own path; password from $DEMO_PASS (random when unset)
  - user: demo
    pass: @DEMO_PASS@
    ips: []
    permissions:
      - action: publish
        path: jetson-c920
paths:
  all_others:
