# hackdash.live box source: add inside the server block of /etc/nginx/sites-available/internal (manager applies).
# The Jetson edge bucket POST goes to netra-ask exactly as before (same proxy settings as `location /ask`), and nginx
# sends a copy to sauron-hack. The mirror's answer is ignored; if sauron-hack is down, netra-ask is unaffected.
# Tested 2026-10-24 21:26-21:31 UTC against a temp unit on :8511: netra-ask kept answering 200 to every bucket.
location = /ask/api/edge/bucket {
    mirror /_hack_edge_mirror;
    proxy_pass http://127.0.0.1:8400;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    client_max_body_size 64m;
}
location = /_hack_edge_mirror {
    internal;
    proxy_pass http://127.0.0.1:8500/hack/api/_edge/bucket;
    proxy_set_header Host $host;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
}
