name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # tests/test_calib.py skips here: it needs a netra-ask checkout (ASK_DIR) for ask/camgeo.py, which is private
      - run: pytest -rs
