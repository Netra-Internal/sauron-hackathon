# demo-node reverse-ssh fallback (nodeguard, 2026-10-27): the Pi holds -R 127.0.0.1:2201 -> its own sshd, so the Pi
# stays reachable when Tailscale is down: ssh -J root@<droplet> -p 2201 netra@127.0.0.1
# Keepalive so a dead session from the Pi frees 2201 within ~45 s (global ClientAliveInterval is 0).
Match User noderev
    ClientAliveInterval 15
    ClientAliveCountMax 3
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:2201
    PermitOpen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /bin/false
